spring.application.name=EstanteIndie

spring.datasource.url=jdbc:h2:mem:estanteindie
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

app.seed.enabled=true

app.pagination.max-page-size=100

# Versão da API mostrada no Swagger (a API tem as versões v1 e v2 das rotas)
springdoc.version=2.0
